[package]
name = "loudible-adapters"
version.workspace = true
edition.workspace = true

[dependencies]
aes = "0.8"
async-trait = "0.1"
base64 = "0.22"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"
loudible-core = { path = "../loudible-core" }
percent-encoding = "2"
# TLS uses ring: aws-lc-rs would add CMake and NASM to Windows builds.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
loudible-test-support = { path = "../loudible-test-support" }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
